services:
  postgres:
    image: postgres:16-alpine
    container_name: inss-postgres
    environment:
      POSTGRES_USER: inss
      POSTGRES_PASSWORD: inss123
      POSTGRES_DB: inss_contribuintes
    ports:
      - "5432:5432"
    volumes:
      - inss_pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inss -d inss_contribuintes"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  inss_pgdata:

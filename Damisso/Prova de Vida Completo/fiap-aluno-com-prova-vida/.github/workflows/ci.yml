name: CI — INSS Modernização

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projeto/api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: inss
          POSTGRES_PASSWORD: inss123
          POSTGRES_DB: inss_contribuintes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inss -d inss_contribuintes"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Create beneficios database
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          PGPASSWORD=inss123 psql -h localhost -U inss -d inss_contribuintes -c "CREATE DATABASE inss_beneficios;"
        working-directory: .

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Unit & Integration Tests
        env:
          ConnectionStrings__Default: Host=localhost;Port=5432;Database=inss_contribuintes;Username=inss;Password=inss123
        run: dotnet test --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'

  frontend:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Build Frontend
        working-directory: projeto/app
        run: |
          npm ci
          npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: projeto/app/dist
